name: Docker Validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docker-validate:
    # ARC runners on our workspace cluster run Docker through a dind sidecar.
    # Base-image pulls are stable there, so we can drop the old host cache warmup
    # step from the legacy runner. We still forward proxy build args because the
    # Dockerfile's RUN steps need outbound access inside the image build itself.
    # Proxy values are not hard-coded here: the job simply forwards whatever
    # proxy environment the current runner exposes, which keeps runner migration
    # or proxy rotation localized to runner config instead of this workflow.
    runs-on: roku-arc
    steps:
      - uses: actions/checkout@v7

      - name: Validate linux/amd64 Dockerfile build
        env:
          DOCKER_BUILDKIT: "1"
        run: |
          build_args=()
          for var in http_proxy https_proxy all_proxy HTTP_PROXY HTTPS_PROXY ALL_PROXY no_proxy NO_PROXY; do
            if [ -n "${!var:-}" ]; then
              build_args+=(--build-arg "$var")
            fi
          done

          docker build \
            "${build_args[@]}" \
            --platform linux/amd64 \
            --file deploy/Dockerfile \
            .
