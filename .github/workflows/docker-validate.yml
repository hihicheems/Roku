name: Docker Validate

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docker-build:
    runs-on:
      - self-hosted
      - linux
      - x64
    steps:
      - uses: actions/checkout@v6

      - name: Warm Docker base image cache
        run: |
          ensure_image() {
            local image="$1"
            if docker image inspect "$image" >/dev/null 2>&1; then
              echo "Using cached image: $image"
            else
              echo "Pulling image: $image"
              docker pull "$image"
            fi
          }

          ensure_image rust:1.92-alpine
          ensure_image alpine:3.23

      - name: Validate linux/amd64 Docker build
        env:
          DOCKER_BUILDKIT: "1"
        run: docker build --network host --platform linux/amd64 --file deploy/Dockerfile .
