name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main

env:
  # Disable incremental compilation for faster from-scratch builds
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_TEST_DEBUG: 0

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  check:
    # ARC runner pods now use a custom image that already carries the native
    # C toolchain, the pinned Rust toolchain, hawkeye, and cargo-nextest.
    # Keep runtime steps as fast verification + remote cache restore instead of
    # reinstalling the same toolchain on every ephemeral runner.
    runs-on: &linux_runner roku-arc
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/ensure-native-build-toolchain
        with:
          required-tools: |
            cc
            pkg-config
            rustc
            cargo
            hawkeye
      - uses: Swatinem/rust-cache@v2
        with:
          # ARC runner images already preinstall CLI tooling, so avoid uploading
          # ~/.cargo/bin and keep PR jobs restore-only to skip long cache saves.
          cache-bin: false
          save-if: false

      - name: Bash syntax check
        shell: bash
        run: |
          mapfile -t scripts < <(find scripts -type f -name '*.sh' | sort)
          if [[ ${#scripts[@]} -eq 0 ]]; then
            echo "No shell scripts found."
            exit 0
          fi

          for script in "${scripts[@]}"; do
            echo "Checking $script"
            bash -n "$script"
          done

      - name: Check License Header
        run: hawkeye check

      - name: Fmt check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --all-targets --workspace -- -D warnings

  build:
    runs-on: *linux_runner
    env:
      CARGO_PROFILE_RELEASE_LTO: true
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 1
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/ensure-native-build-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          # Only persist refreshed caches from the canonical branch pushes.
          save-if: ${{ github.event_name == 'push' }}
      - name: Build
        run: cargo build --release --locked

  unit:
    runs-on: *linux_runner
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/ensure-native-build-toolchain
        with:
          required-tools: |
            cc
            pkg-config
            rustc
            cargo
            cargo-nextest
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          save-if: false

      - run: cargo check --locked

      - name: Test
        run: cargo nextest run --locked --workspace --all-features --no-tests=pass
        env:
          RUST_LOG: DEBUG
          RUST_BACKTRACE: full
