name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main

env:
  # Disable incremental compilation for faster from-scratch builds
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_TEST_DEBUG: 0

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  check:
    # Current default Linux runner pool. Change this anchor if the repository
    # moves back to GitHub-hosted Linux or to a different self-hosted label.
    runs-on: &linux_runner roku-arc
    steps:
      - uses: actions/checkout@v6

      # Self-hosted runner bootstrap lives in one local action so proxy-aware
      # package installation and native toolchain assumptions are not duplicated
      # across jobs or workflows.
      - name: Ensure native build toolchain
        uses: ./.github/actions/ensure-native-build-toolchain

      - name: Bash syntax check
        shell: bash
        run: |
          mapfile -t scripts < <(find scripts -type f -name '*.sh' | sort)
          if [[ ${#scripts[@]} -eq 0 ]]; then
            echo "No shell scripts found."
            exit 0
          fi

          for script in "${scripts[@]}"; do
            echo "Checking $script"
            bash -n "$script"
          done

      - uses: dtolnay/rust-toolchain@stable

      - name: Check License Header
        uses: korandoru/hawkeye@v6
        with:
          config: licenserc.toml

      - name: Fmt check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --all-targets --workspace -- -D warnings

  build:
    runs-on: *linux_runner
    env:
      CARGO_PROFILE_RELEASE_LTO: true
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 1
    steps:
      - uses: actions/checkout@v6
      - name: Ensure native build toolchain
        uses: ./.github/actions/ensure-native-build-toolchain

      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release --locked

  unit:
    runs-on: *linux_runner
    steps:
      - uses: actions/checkout@v6
      - name: Ensure native build toolchain
        uses: ./.github/actions/ensure-native-build-toolchain

      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@nextest

      - run: cargo check --locked

      - name: Test
        run: cargo nextest run --locked --workspace --all-features --no-tests=pass
        env:
          RUST_LOG: DEBUG
          RUST_BACKTRACE: full
