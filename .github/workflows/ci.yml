name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main

env:
  # Disable incremental compilation for faster from-scratch builds
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  RUST_TOOLCHAIN_VERSION: "1.95.0"
  HAWKEYE_VERSION: "6.5.1"
  CARGO_NEXTEST_VERSION: "0.9.132"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  check:
    # ARC runner pods now use a custom image that already carries the native
    # C toolchain, the pinned Rust toolchain, hawkeye, and cargo-nextest.
    # Keep runtime steps focused on verification and compilation instead of
    # reinstalling the same toolchain on every ephemeral runner. Avoid adding
    # third-party cache actions here because ARC's proxy path to GitHub action
    # tarballs has proven less reliable than the runner image itself.
    runs-on: &linux_runner roku-arc
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ensure-native-build-toolchain
        with:
          required-tools: |
            cc
            pkg-config
            rustc=${{ env.RUST_TOOLCHAIN_VERSION }}
            cargo=${{ env.RUST_TOOLCHAIN_VERSION }}
            rustfmt
            cargo-fmt
            cargo-clippy
            hawkeye=${{ env.HAWKEYE_VERSION }}

      - name: Bash syntax check
        shell: bash
        run: |
          mapfile -t scripts < <(find scripts -type f -name '*.sh' | sort)
          if [[ ${#scripts[@]} -eq 0 ]]; then
            echo "No shell scripts found."
            exit 0
          fi

          for script in "${scripts[@]}"; do
            echo "Checking $script"
            bash -n "$script"
          done

      - name: Cache-utilization gate self-test
        shell: bash
        run: |
          # Surface a clear "missing python3" signal before invoking the
          # script so a runner-image regression fails the step with a
          # readable diagnostic instead of a generic "command not found".
          if ! command -v python3 >/dev/null 2>&1; then
            echo "ERROR: python3 not on PATH; cache-utilization gate cannot run." >&2
            exit 1
          fi
          python3 --version
          python3 scripts/cache-utilization-check.py --self-test

      - name: Check License Header
        run: hawkeye check

      - name: Fmt check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --all-targets --workspace -- -D warnings

  build:
    runs-on: *linux_runner
    env:
      CARGO_PROFILE_RELEASE_LTO: true
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 1
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ensure-native-build-toolchain
        with:
          required-tools: |
            cc
            pkg-config
            rustc=${{ env.RUST_TOOLCHAIN_VERSION }}
            cargo=${{ env.RUST_TOOLCHAIN_VERSION }}
      - name: Build
        run: cargo build --release --locked

  unit:
    runs-on: *linux_runner
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ensure-native-build-toolchain
        with:
          required-tools: |
            cc
            pkg-config
            rustc=${{ env.RUST_TOOLCHAIN_VERSION }}
            cargo=${{ env.RUST_TOOLCHAIN_VERSION }}
            cargo-nextest=${{ env.CARGO_NEXTEST_VERSION }}

      - run: cargo check --locked

      - name: Test
        run: cargo nextest run --locked --workspace --all-features --no-tests=pass
        env:
          RUST_LOG: DEBUG
          RUST_BACKTRACE: full
