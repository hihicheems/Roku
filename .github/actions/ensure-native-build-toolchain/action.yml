name: Ensure Native Build Toolchain
description: Verify that the ARC runner image already includes the required native and Rust toolchain binaries.

inputs:
  required-tools:
    description: Newline-delimited list of binaries that must be available on PATH, optionally as tool=expected-version-substring.
    required: false
    default: |
      cc
      pkg-config
      rustc
      cargo
  probe-timeout-seconds:
    description: Maximum number of seconds to wait for each tool --version probe before treating it as unusable.
    required: false
    default: "15"

runs:
  using: composite
  steps:
    - name: Verify preinstalled toolchain
      shell: bash
      run: |
        set -euo pipefail

        mapfile -t required_tools < <(printf '%s\n' '${{ inputs.required-tools }}' | sed '/^[[:space:]]*$/d')
        probe_timeout_seconds='${{ inputs.probe-timeout-seconds }}'

        if [[ ${#required_tools[@]} -eq 0 ]]; then
          echo "No required tools configured."
          exit 0
        fi

        missing=()
        unusable=()
        drifted=()

        for requirement in "${required_tools[@]}"; do
          tool="${requirement}"
          expected_version=""
          if [[ "${requirement}" == *"="* ]]; then
            tool="${requirement%%=*}"
            expected_version="${requirement#*=}"
          fi

          if ! command -v "${tool}" >/dev/null 2>&1; then
            missing+=("${tool}")
            continue
          fi

          probe_output=""
          probe_status=0
          set +e
          if command -v timeout >/dev/null 2>&1; then
            probe_output="$(timeout "${probe_timeout_seconds}" "${tool}" --version 2>&1)"
            probe_status=$?
          else
            probe_output="$("${tool}" --version 2>&1)"
            probe_status=$?
          fi
          set -e

          version_line="$(printf '%s\n' "${probe_output}" | sed -n '/./{p;q;}')"

          if [[ ${probe_status} -ne 0 ]]; then
            unusable+=("${tool}")
            if [[ ${probe_status} -eq 124 ]]; then
              printf '%s: timed out after %ss while executing --version probe\n' "${tool}" "${probe_timeout_seconds}" >&2
            else
              printf '%s: failed to execute --version probe (exit %s)\n' "${tool}" "${probe_status}" >&2
            fi
            if [[ -n "${version_line}" ]]; then
              printf '%s: %s\n' "${tool}" "${version_line}" >&2
            fi
            continue
          fi

          if [[ -n "${version_line}" ]]; then
            echo "${tool}: ${version_line}"
          else
            echo "${tool}: found"
          fi

          if [[ -n "${expected_version}" && "${probe_output}" != *"${expected_version}"* ]]; then
            if [[ -n "${version_line}" ]]; then
              drifted+=("${tool} expected '${expected_version}' got '${version_line}'")
            else
              drifted+=("${tool} expected '${expected_version}' but emitted no version output")
            fi
          fi
        done

        if [[ ${#missing[@]} -gt 0 ]]; then
          printf 'Missing preinstalled tools in ARC runner image: %s\n' "${missing[*]}" >&2
        fi

        if [[ ${#unusable[@]} -gt 0 ]]; then
          printf 'Unusable preinstalled tools in ARC runner image: %s\n' "${unusable[*]}" >&2
        fi

        if [[ ${#drifted[@]} -gt 0 ]]; then
          printf 'Version drift detected in ARC runner image:\n' >&2
          printf '  - %s\n' "${drifted[@]}" >&2
        fi

        if [[ ${#missing[@]} -gt 0 || ${#unusable[@]} -gt 0 || ${#drifted[@]} -gt 0 ]]; then
          printf 'Rebuild and redeploy the custom ARC runner image instead of installing them at job runtime.\n' >&2
          exit 1
        fi
