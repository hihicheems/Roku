serviceAccount:
  create: true
  name: arc-controller-sa

# Workspace installs often need an explicit corporate proxy. Keep both case
# variants because different components read different environment variables.
env:
  - name: http_proxy
    value: http://proxy.i.brainpp.cn:3128
  - name: https_proxy
    value: http://proxy.i.brainpp.cn:3128
  - name: all_proxy
    value: http://proxy.i.brainpp.cn:3128
  - name: HTTP_PROXY
    value: http://proxy.i.brainpp.cn:3128
  - name: HTTPS_PROXY
    value: http://proxy.i.brainpp.cn:3128
  - name: ALL_PROXY
    value: http://proxy.i.brainpp.cn:3128
  - name: no_proxy
    value: clear.ml,kubebrain,kubebrain.com,svc,.svc,.cluster.local,brainpp.cn,brainpp.local,brainpp.ml,megvii-inc.com,megvii-op.org,127.0.0.1,localhost,::1,kubernetes,kubernetes.default,kubernetes.default.svc,kubernetes.default.svc.cluster.local,10.42.0.0/16,10.43.0.0/16,10.43.0.1
  - name: NO_PROXY
    value: clear.ml,kubebrain,kubebrain.com,svc,.svc,.cluster.local,brainpp.cn,brainpp.local,brainpp.ml,megvii-inc.com,megvii-op.org,127.0.0.1,localhost,::1,kubernetes,kubernetes.default,kubernetes.default.svc,kubernetes.default.svc.cluster.local,10.42.0.0/16,10.43.0.0/16,10.43.0.1

flags:
  logLevel: info
  logFormat: text
  watchSingleNamespace: arc-runners
