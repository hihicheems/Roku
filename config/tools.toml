# Tool catalog metadata for builtin tools.
# `terminal_output = true` means the tool contract is allowed to stop the loop
# after a successful observation; this is descriptor metadata, not runtime-side
# follow-up routing.

[[tools]]
name = "skill.ensure_installed"
role = "skill_install"
discoverable = false
description = "Use this when the user wants a skill installed from a concrete supported source URL so it becomes available locally. Do not use it to run a skill or explain what an already installed skill does. The result is an installation report you can use to confirm availability and source details."
tags = ["skills", "registry", "installation"]
examples = ["Install the claude-api skill from a GitHub URL."]
input_schema = ["source_url"]
risk = "Medium"
cost = { estimated_tokens = 0, estimated_latency_ms = 120000 }
required_capabilities = ["skill.ensure_installed"]

[[tools]]
name = "skill.execute"
role = "skill_execute"
discoverable = false
description = "Run an already installed script-backed skill when the user wants that skill to actually do work in the workspace. Do not use it to explain what a skill does or summarize its local docs; use a conversational worker for that. The result is grounded execution evidence, not just advisory prose."
tags = ["skills", "execution", "scripts", "generation"]
examples = ["Use the skill-creator skill to generate a new Python skill in the project."]
input_schema = ["goal", "summary", "conversation_history"]
risk = "Medium"
cost = { estimated_tokens = 12000, estimated_latency_ms = 120000 }
required_capabilities = ["skill.execute"]

[[tools]]
name = "inventory.describe"
role = "inventory"
discoverable = true
terminal_output = true
description = "Use this when the user asks what skills, tools, or capability families are currently available in this runtime. Do not use it to execute a skill or guess about disabled capabilities. It returns grounded local inventory state that can be reformatted for the user."
tags = ["inventory", "skills", "tools", "capabilities", "listing"]
examples = [
  "What skills and tools do you currently have?",
  "你现在有啥 skill？",
  "你有哪些技能和工具？",
  "List the installed skills and capability families as bullet points.",
  "Reformat the available inventory as an unordered list."
]
input_schema = ["goal", "summary", "conversation_history"]
risk = "Low"
cost = { estimated_tokens = 10000, estimated_latency_ms = 12000 }
required_capabilities = ["inventory.read"]

[tools.contract.selection]
use_when = [
  "The user asks what tools, skills, or capability families are available right now.",
  "The runtime needs grounded local inventory state instead of a free-form explanation."
]
avoid_when = [
  "The user wants to execute a skill or perform filesystem, table, web, or python work.",
  "The request is only asking for a conversational explanation that is already proven by prior evidence."
]
common_confusions = [
  "general.execute for free-form explanation after inventory has already been gathered",
  "skill.execute when the user wants to run an installed skill instead of list capabilities"
]

[tools.contract.input]
preconditions = [
  "The request should be answerable from local runtime inventory without external execution."
]

[[tools.contract.input.fields]]
name = "goal"
required = true
semantics = "The user-visible inventory question or listing request."
invalid_when = ["It is empty or unrelated to available tools, skills, or capability families."]

[[tools.contract.input.fields]]
name = "summary"
required = true
semantics = "Short execution hint telling the worker what inventory framing the runtime needs."
invalid_when = ["It invents tools or capabilities that are not present in local runtime state."]

[[tools.contract.input.fields]]
name = "conversation_history"
required = false
semantics = "Recent user context needed to preserve phrasing or language when presenting inventory."
invalid_when = ["It is treated as authority over the actual local inventory snapshot."]

[tools.contract.output]
success_semantics = "Returns a user-facing inventory summary grounded in the current local runtime state."
empty_result_semantics = "An empty inventory still means the tool succeeded and should say that nothing relevant is currently available."
error_semantics = [
  "Provider or runtime failures should surface as tool failures, not as fabricated inventory facts."
]
non_terminal_success = false
terminal_success = true

[tools.contract.runtime]
side_effects = "none"
retry_policy = "never"
timeout_ms = 45000
isolation_profile = "no_isolation"

[[tools]]
name = "research.synthesize"
role = "research"
discoverable = true
terminal_output = true
description = "Use this after relevant evidence has already been gathered and the user needs a grounded summary, comparison, or synthesis. Do not use it instead of `web.search`, `fs.read_text`, or other evidence-gathering tools. It returns a user-facing synthesis built from current context rather than new external facts."
tags = ["research", "analysis", "information"]
examples = ["Summarize the latest requirements from the project docs."]
input_schema = ["goal", "summary"]
risk = "Low"
cost = { estimated_tokens = 6000, estimated_latency_ms = 30000 }
required_capabilities = ["information.read"]

[[tools]]
name = "data.execute"
role = "data"
discoverable = true
terminal_output = true
description = "Use this for structured data transformation, aggregation, metrics rollups, or compact table-like output when the needed data is already in context. Do not use it for free-form critique or for gathering missing source material. It returns processed data results that can be presented directly or explained later."
tags = ["data", "metrics", "pipeline"]
examples = ["Aggregate the experiment results into a compact table."]
input_schema = ["goal", "summary"]
risk = "Low"
cost = { estimated_tokens = 7000, estimated_latency_ms = 35000 }
required_capabilities = ["data.read"]

[[tools]]
name = "review.assess"
role = "review"
discoverable = true
terminal_output = true
description = "Use this when the user wants critique, correctness review, or residual risks called out on an existing draft, plan, or proposal. Do not use it to create the draft from scratch or to perform unrelated data processing. It returns review findings and risk-focused feedback, not side effects."
tags = ["review", "validation", "risk"]
examples = ["Review the proposed plan and list the main risks."]
input_schema = ["goal", "summary"]
risk = "Medium"
cost = { estimated_tokens = 5000, estimated_latency_ms = 20000 }
required_capabilities = ["review.check"]

[[tools]]
name = "general.execute"
role = "general"
discoverable = false
terminal_output = true
description = "Use this for plain conversation or for the last-mile explanation after other tools have already gathered the needed evidence. Do not use it to guess filesystem, web, table, or python results that a concrete tool could produce directly. It returns user-facing prose only and should not be treated as grounded external execution."
tags = ["general", "conversation"]
examples = ["Reply to a simple greeting or explain available capabilities."]
input_schema = ["goal", "summary"]
risk = "Low"
cost = { estimated_tokens = 8000, estimated_latency_ms = 15000 }
required_capabilities = []
