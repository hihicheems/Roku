# Runtime-tunable, non-secret defaults for plugin crates.
# Secrets stay in environment variables and are rejected if added here.
#
# Ownership:
# - [runtime.agent.*]        -> crates/roku-agent-runtime
# - [runtime.tools.*]        -> crates/roku-plugins/tools
# - [runtime.llm.openrouter] -> crates/roku-plugins/llm
# - [runtime.telegram]       -> crates/roku-plugins/telegram
# - [runtime.skills]         -> crates/roku-plugins/skills
# - [runtime.memory.*]       -> provider-neutral ownership in crates/roku-memory
#                               startup parsing/materialization currently lives in
#                               crates/roku-cmd as migration residue
#
# Values in this file are runtime defaults and overrides.
# Final hard ceilings still live in code so one bad edit cannot push the
# process past its safety envelope.

[runtime.agent.loop]
# Initial maximum number of tool-loop steps before the runtime forces termination.
initial_step_budget = 30
# Initial maximum number of recovery attempts after non-terminal tool failures.
initial_recovery_budget = 5

[runtime.agent.router]
# Target size of the JSON route-classifier response.
expected_output_tokens = 220
# Token budget reserved for the route-classifier prompt plus response.
budget_tokens_remaining = 10000
# Cost budget reserved for a single route-classifier call.
budget_cost_remaining_usd = 0.1
# Maximum number of inventory entries exposed to the route classifier in one prompt.
candidate_inventory_limit = 10

[runtime.agent.prompts]
# Maximum characters kept from one visible tool hint inside ContextProjection.
visible_tool_hint_max_chars = 180
# Maximum characters kept from one route-candidate selection hint.
candidate_description_max_chars = 180

[runtime.agent.next_step]
# Target size of one generic loop next-step JSON decision.
expected_output_tokens = 1200
# Token budget reserved for one generic loop next-step model call.
budget_tokens_remaining = 10000
# Cost budget reserved for one generic loop next-step model call.
budget_cost_remaining_usd = 0.05

[runtime.tools.fs]
# Default byte cap for one fs.read_text call when the request does not provide `max_bytes`.
# Raised from 4096 to support typical source files without truncation.
default_max_bytes = 65536
# Maximum directory entries returned by one fs.list_dir call before truncation.
max_dir_entries = 200
# Maximum glob matches returned by one fs.glob call before truncation.
max_glob_matches = 200
# Maximum descendant entries scanned while resolving fuzzy basenames for fs.find.
max_descendant_scan_entries = 8000

[runtime.tools.command]
# Default subprocess timeout for command.run (was 1500 ms).
# Build commands (cargo, just, npm, make) get a longer timeout via TimeoutProfile
# in code; this value applies to quick/read-only commands.
default_timeout_ms = 30000
# Maximum stdout/stderr bytes retained from one command.run invocation (was 8192).
max_output_bytes = 65536

[runtime.tools.python]
# Default subprocess timeout for python.run.
default_timeout_ms = 60000
# Maximum stdout/stderr bytes retained from one python.run invocation.
max_output_bytes = 8192

[runtime.tools.table]
# Default row count returned by table.preview when the request does not specify `rows`.
default_preview_rows = 5

[runtime.tools.web]
# Default result count returned by web.search when the request does not specify `top_k`.
default_top_k = 5

[runtime.tools.workers]
# Timeout applied to tool-backed LLM workers such as inventory.describe, research.synthesize, or data.execute.
llm_tool_timeout_ms = 45000
# Character budget for injected installed-skill excerpts inside worker prompts.
max_skill_prompt_context_chars = 16000
# Maximum characters retained from raw worker output before sanitization/truncation.
max_skill_execution_output_chars = 4000

[runtime.llm]
# Which provider backs the live LLM runtime. One of: "openrouter" (default),
# "anthropic", "openai". Omit to keep the OpenRouter-backed behavior.
# API keys for every provider remain env-only:
#   - OPENROUTER_API_KEY         -> openrouter
#   - ROKU_ANTHROPIC_API_KEY     -> anthropic
#   - ROKU_OPENAI_API_KEY        -> openai
# provider = "openrouter"
#
# OAuth client_id for the OpenAI PKCE authorization flow. Required when using
# `roku chat` first-run OAuth setup. Obtain one by registering an OAuth app
# with OpenAI, or use the Codex CLI client_id for development/testing.
# oauth_client_id = "app_EMoamEEZ73f0CkXaXp7hrann"

[runtime.llm.openrouter]
# Primary model id for live LLM routing.
primary_model = "deepseek-chat"
# Ordered fallback chain when the primary model/provider cannot serve the request.
fallback_models = ["gemini-2.0-flash"]
# Base URL for the OpenRouter-compatible chat-completions endpoint.
base_url = "https://openrouter.ai/api/v1/chat/completions"
# OPENROUTER_API_KEY remains env-only.
# Hard policy ceiling for model context size considered eligible by the router.
max_context_tokens = 128000
# Cost estimate used by local budget checks; 0.0 means "do not enforce via price".
cost_per_1k_tokens_usd = 0.0
# Maximum allowed estimated cost for a single routed LLM request.
max_request_cost_usd = 1.0
# Maximum allowed provider latency before the router treats the model as too slow.
max_latency_ms = 60000

# [runtime.llm.anthropic]
# # Primary Anthropic model used when provider = "anthropic".
# primary_model = "claude-sonnet-4-5-20250929"
# # Ordered fallback chain applied on retryable failures.
# fallback_models = ["claude-3-5-haiku-20241022"]
# # Override the base URL only if routing through a proxy.
# base_url = "https://api.anthropic.com/v1/messages"
# # Upper bound on output tokens per Anthropic request.
# max_tokens = 8192
# max_context_tokens = 200000
# cost_per_1k_tokens_usd = 0.0
# max_request_cost_usd = 1.0
# max_latency_ms = 60000

# [runtime.llm.openai]
# # Primary OpenAI model used when provider = "openai".
# primary_model = "gpt-4o"
# fallback_models = ["gpt-4o-mini"]
# base_url = "https://api.openai.com/v1/chat/completions"
# max_tokens = 8192
# max_context_tokens = 128000
# cost_per_1k_tokens_usd = 0.0
# max_request_cost_usd = 1.0
# max_latency_ms = 60000

[runtime.telegram]
# API base URL for Telegram HTTP requests.
api_base_url = "https://api.telegram.org"
# TELOXIDE_TOKEN / TELEGRAM_BOT_TOKEN remain env-only.
# Long-poll timeout in seconds for one getUpdates request.
poll_timeout_seconds = 30
# Idle backoff between polling iterations when there is no work.
idle_backoff_ms = 500
# Number of consecutive poll failures before noisy logging starts.
poll_error_log_threshold = 5
# Whether to emit progress notices back to Telegram chats.
progress_notices_enabled = true
# Whether outbound Telegram messages should include request metadata.
include_request_metadata = false
# Whether outbound Telegram messages should include attachment details.
show_attachments = false

[runtime.skills]
# HTTP timeout for downloading/installing skills.
http_timeout_seconds = 30
# Maximum compressed archive size accepted during skill installation.
max_archive_bytes = 33554432
# Maximum bytes extracted from one prompt-supporting skill document.
max_prompt_document_bytes = 24576
# Maximum number of skill documents included in prompt context.
max_prompt_documents = 24

[runtime.memory]
# Memory is enabled by default and uses the SQLite backend for zero-configuration
# long-term memory. Set backend = "openviking" to use the external OpenViking service.
enabled = true
# Backend selection stays provider-neutral even when a given deployment only enables one adapter.
backend = "sqlite"

[runtime.memory.recall]
# Long-term recall stays under Roku-owned control.
enabled = true
top_k = 8

[runtime.memory.write]
# Long-term write-back stays under Roku-owned control.
enabled = true
max_batch_size = 16

# Provider-specific config now lives only under `runtime.memory.backends.*`.
# These subtrees describe adapter details; they do not redefine Roku-owned
# top-level memory semantics or lifecycle behavior.
[runtime.memory.backends.openviking.client]
# HTTP endpoint for the external OpenViking service when Roku calls it as a backend.
base_url = "http://127.0.0.1:1933"
connect_timeout_ms = 1000
request_timeout_ms = 5000
# Secrets such as client auth remain env-only.

[runtime.memory.backends.openviking.adapter]
# Roku-owned adapter settings for mapping memory records into OpenViking resources.
resource_root_uri = "viking://resources/roku-memory"
staging_dir = ".roku/openviking/staging"
write_wait_timeout_ms = 120000
strict = true

[runtime.memory.backends.openviking.process]
# Managed process startup remains opt-in; the generated ov.conf is a provider artifact,
# not the system's source of truth.
managed = false
# Generated config artifact path; this file is rendered from typed config rather than hand-edited.
config_output_path = ".roku/run/openviking/ov.conf"

[runtime.memory.backends.openviking.process.storage]
# Workspace root consumed by the generated OpenViking service config.
workspace = ".roku/openviking/workspace"
# These backend selectors remain Roku-owned process config for future managed-process wiring.
# The current OpenViking release template only consumes `storage.workspace`.
vectordb_backend = "local"
agfs_backend = "local"

[runtime.memory.backends.openviking.process.server]
# Server binding hints are reserved for later dev process wiring.
# The current OpenViking release template does not consume them from `ov.conf`.
host = "127.0.0.1"
port = 1933

[runtime.memory.backends.openviking.process.embedding]
provider = "openai"
api_base = "https://openrouter.ai/api/v1"
model = "thenlper/gte-base"
dimension = 768
max_concurrent = 8

[runtime.memory.backends.openviking.process.vlm]
provider = "openai"
api_base = "https://openrouter.ai/api/v1"
model = "qwen/qwen3.5-flash-02-23"
max_concurrent = 16
thinking = false

[runtime.memory.backends.sqlite]
# SQLite remains an adapter-level implementation for short-term continuity,
# session-state, and pending-loop residue during the migration; it is not a
# long-term owner of memory subsystem semantics.
path = ".roku/state/control-plane.db"
