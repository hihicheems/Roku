[package]
name = "roku-cmd"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = []
memory-openviking = []

[dependencies]
async-trait = "0.1"
actix-web = "4"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "signal"] }
dotenvy = "0.15"
roku-agent-runtime = { path = "../roku-agent-runtime" }
roku-api-gateway = { path = "../roku-api-gateway" }
roku-common-types = { path = "../roku-common-types" }
roku-memory = { path = "../roku-memory" }
roku-plugin-host = { path = "../roku-plugins/host" }
roku-plugin-llm = { path = "../roku-plugins/llm" }
roku-plugin-skills = { path = "../roku-plugins/skills" }
roku-plugin-memory-openviking = { path = "../roku-plugins/memory-openviking" }
roku-plugin-memory-sqlite = { path = "../roku-plugins/memory-sqlite" }
roku-plugin-tools = { path = "../roku-plugins/tools" }
roku-plugin-mcp = { path = "../roku-plugins/mcp" }
roku-plugin-telegram = { path = "../roku-plugins/telegram" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Markdown rendering
pulldown-cmark = "0.13"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
crossterm = "0.29"
unicode-width = "0.2"
# Diff rendering
similar = "3"
toml = "1.1"
thiserror = "2"
time = { version = "0.3", features = ["formatting"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "registry"] }
tracing-appender = "0.2"
# Auth dependencies
base64 = "0.22"
open = "5"
percent-encoding = "2"
rand = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.11"
tiny_http = "0.12"

[dev-dependencies]
tempfile = "3"
zip = { version = "8", default-features = false, features = ["deflate"] }
