[package]
name = "roku-connectors-telegram"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
roku-plugin-telegram = { path = "../roku-plugins/telegram" }
roku-common-types = { path = "../roku-common-types" }
roku-observability = { path = "../roku-observability" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
