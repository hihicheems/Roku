[package]
name = "roku-plugin-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
rmcp = { version = "2.2", features = ["client", "transport-child-process"] }
tokio = { version = "1", features = ["rt"] }
serde_json = "1"
tracing = "0.1"
roku-plugin-host = { path = "../host" }
roku-plugin-tools = { path = "../tools" }
roku-common-types = { path = "../../roku-common-types" }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tempfile = "3"
