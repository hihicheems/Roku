[package]
name = "roku-plugin-tools"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
roku-common-types = { path = "../../roku-common-types" }
roku-llm-adapter = { package = "roku-plugin-llm", path = "../llm" }
roku-observability = { path = "../../roku-observability" }
roku-resource-catalog = { package = "roku-plugin-catalog", path = "../catalog" }
roku-skill-registry = { package = "roku-plugin-skills", path = "../skills" }
roku-tool-runtime = { package = "roku-plugin-host", path = "../host" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "local-offset"] }
url = "2"

[dev-dependencies]
tempfile = "3"
zip = { version = "8", default-features = false, features = ["deflate"] }
