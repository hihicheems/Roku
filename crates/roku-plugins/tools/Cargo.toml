[package]
name = "roku-plugin-tools"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
calamine = "0.34"
csv = "1"
glob = "0.3"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
roku-common-types = { path = "../../roku-common-types" }
roku-observability = { path = "../../roku-observability" }
roku-plugin-catalog = { path = "../catalog" }
roku-plugin-core = { path = "../core" }
roku-plugin-host = { path = "../host" }
roku-plugin-llm = { path = "../llm" }
roku-plugin-skills = { path = "../skills" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
shlex = "1"
toml = "1.1"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "local-offset"] }
url = "2"

[dev-dependencies]
tempfile = "3"
zip = { version = "8", default-features = false, features = ["deflate"] }
