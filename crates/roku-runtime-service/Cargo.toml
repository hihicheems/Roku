[package]
name = "roku-runtime-service"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
roku-agent-runtime = { path = "../roku-agent-runtime" }
roku-artifact-store = { path = "../roku-artifact-store" }
roku-capability-auth = { path = "../roku-capability-auth" }
roku-common-types = { path = "../roku-common-types" }
roku-experiment-registry = { path = "../roku-experiment-registry" }
roku-observability = { path = "../roku-observability" }
roku-orchestrator = { path = "../roku-orchestrator" }
roku-plugin-catalog = { path = "../roku-plugins/catalog" }
roku-state-store = { path = "../roku-state-store" }
roku-validation-plane = { path = "../roku-validation-plane" }
serde_json = "1"

[dev-dependencies]
roku-plugin-skills = { path = "../roku-plugins/skills" }
serde_json = "1"
tempfile = "3"
zip = { version = "8", default-features = false, features = ["deflate"] }
