[package]
name = "roku-runtime-service"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
roku-agent-runtime = { path = "../roku-agent-runtime" }
roku-common-types = { path = "../roku-common-types" }
roku-memory = { path = "../roku-memory" }
roku-plugin-tools = { path = "../roku-plugins/tools" }
serde_json = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }

[dev-dependencies]
roku-plugin-skills = { path = "../roku-plugins/skills" }
serde_json = "1"
tempfile = "3"
zip = { version = "8", default-features = false, features = ["deflate"] }
