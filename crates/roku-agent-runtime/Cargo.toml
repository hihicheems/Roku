[package]
name = "roku-agent-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
roku-common-types = { path = "../roku-common-types" }
roku-llm-adapter = { path = "../roku-llm-adapter" }
roku-observability = { path = "../roku-observability" }
roku-skill-registry = { path = "../roku-skill-registry" }
roku-tool-runtime = { path = "../roku-tool-runtime" }
serde_json = "1"
time = { version = "0.3", features = ["formatting", "local-offset"] }
url = "2"

[dev-dependencies]
tempfile = "3"
zip = { version = "8", default-features = false, features = ["deflate"] }
