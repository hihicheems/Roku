[package]
name = "roku-agent-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
async-trait = "0.1"
roku-common-types = { path = "../roku-common-types" }
roku-memory = { path = "../roku-memory" }
roku-plugin-host = { path = "../roku-plugins/host" }
roku-plugin-llm = { path = "../roku-plugins/llm" }
roku-plugin-skills = { path = "../roku-plugins/skills" }
roku-plugin-tools = { path = "../roku-plugins/tools" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "local-offset"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time"] }
url = "2"

[dev-dependencies]
tempfile = "3"
serde_json = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
zip = { version = "8", default-features = false, features = ["deflate"] }
