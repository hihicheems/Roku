[package]
name = "roku-task-planner"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
roku-common-types = { path = "../roku-common-types" }
roku-llm-adapter = { path = "../roku-llm-adapter" }
roku-planning-engine = { path = "../roku-planning-engine" }
roku-resource-catalog = { path = "../roku-resource-catalog" }
roku-skill-registry = { path = "../roku-skill-registry" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
zip = { version = "8", default-features = false, features = ["deflate"] }
